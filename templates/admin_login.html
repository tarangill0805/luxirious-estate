<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f4f7;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
        }

        .login-box {
            width: 380px;
            background: white;
            padding: 35px;

            border-radius: 12px;

            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;

            border: 1px solid #ccc;
            border-radius: 7px;

            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;

            padding: 13px;

            border: none;
            border-radius: 7px;

            background: #111827;
            color: white;

            font-size: 16px;

            cursor: pointer;
        }

        button:hover {
            background: #000;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;

            padding: 10px;
            border-radius: 6px;

            margin-bottom: 15px;
        }

    </style>
</head>

<body>

<div class="login-box">

    <h1>Admin Login</h1>

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% for category, message in messages %}

            <div class="error">
                {{ message }}
            </div>

        {% endfor %}

    {% endwith %}

    <form method="POST">

        <label>Username</label>

        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>

        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

</div>

</body>
</html>
