
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Login - Luxirious Estate</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial, sans-serif;

            background: #111827;
        }

        .login-box {
            width: 380px;

            background: white;

            padding: 40px;

            border-radius: 12px;

            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        .logo {
            text-align: center;

            font-size: 28px;

            font-weight: bold;

            margin-bottom: 8px;

            color: #111827;
        }

        .subtitle {
            text-align: center;

            color: #6b7280;

            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-bottom: 7px;

            font-weight: bold;

            color: #374151;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 20px;

            border: 1px solid #d1d5db;

            border-radius: 7px;

            font-size: 15px;
        }

        input:focus {
            outline: none;

            border-color: #111827;
        }

        button {
            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 7px;

            background: #111827;

            color: white;

            font-size: 16px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #374151;
        }

        .error {
            background: #fee2e2;

            color: #991b1b;

            padding: 12px;

            border-radius: 7px;

            margin-bottom: 20px;

            font-size: 14px;
        }

        .back {
            display: block;

            text-align: center;

            margin-top: 20px;

            color: #6b7280;

            text-decoration: none;
        }

        .back:hover {
            color: #111827;
        }

    </style>

</head>

<body>

<div class="login-box">

    <div class="logo">
        Luxirious Estate
    </div>

    <div class="subtitle">
        Admin Login
    </div>


    <!-- FLASH MESSAGES -->

    {% with messages = get_flashed_messages(with_categories=true) %}

        {% if messages %}

            {% for category, message in messages %}

                <div class="error">
                    {{ message }}
                </div>

            {% endfor %}

        {% endif %}

    {% endwith %}


    <!-- LOGIN FORM -->

    <form method="POST">

        <label for="username">
            Username
        </label>

        <input
            type="text"
            id="username"
            name="username"
            placeholder="Enter username"
            required
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            name="password"
            placeholder="Enter password"
            required
        >


        <button type="submit">
            Login
        </button>

    </form>


    <a href="{{ url_for('home') }}" class="back">
        ← Back to Website
    </a>

</div>

</body>

</html>
```
